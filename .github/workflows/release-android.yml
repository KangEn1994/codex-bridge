name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.5.6
        required: true
        type: string
      bridge_url:
        description: Default HTTPS Bridge web URL; clear it to use native pairing setup
        required: false
        default: "https://codex.gnsshub.top"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      CODEX_BRIDGE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      CODEX_BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CODEX_BRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CODEX_BRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release secrets
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$CODEX_BRIDGE_KEYSTORE_PASSWORD"
          test -n "$CODEX_BRIDGE_KEY_ALIAS"
          test -n "$CODEX_BRIDGE_KEY_PASSWORD"
      - name: Decode signing key
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CODEX_BRIDGE_KEYSTORE_PATH"
      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android clean :app:assembleRelease "-PbridgeUrl=${{ inputs.bridge_url }}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/CodexBridge.apk
          sha256sum release/CodexBridge.apk > release/CodexBridge.apk.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/CodexBridge.apk
          release/CodexBridge.apk.sha256
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$CODEX_BRIDGE_KEYSTORE_PATH"
